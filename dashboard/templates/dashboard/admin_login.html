{% extends 'base.html' %}
{% block title %}Admin Login | CampusConnect{% endblock %}
{% block content %}
<div class="row justify-content-center my-5">
    <div class="col-12 col-sm-8 col-md-6 col-lg-4">
        <div class="card border-0 shadow rounded-4 p-4">
            <div class="text-center mb-4">
                <div class="bg-dark text-white rounded-circle d-inline-flex align-items-center justify-content-center mb-3" style="width: 60px; height: 60px;">
                    <i class="fa-solid fa-shield-halved fs-3 text-warning"></i>
                </div>
                <h4 class="fw-bold">Admin Portal Access</h4>
                <p class="text-muted small">Restricted to authorized RIT Hassan Administrators</p>
            </div>
            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-danger py-2 small">{{ message }}</div>
                {% endfor %}
            {% endif %}
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label fw-semibold">Admin Username</label>
                    <input type="text" name="username" class="form-control" placeholder="Enter admin username" required>
                </div>
                <div class="mb-4">
                    <label class="form-label fw-semibold">Password</label>
                    <input type="password" name="password" class="form-control" placeholder="Enter password" required>
                </div>
                <button type="submit" class="btn btn-dark w-100 py-2 fw-semibold">Unlock Admin Portal</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
