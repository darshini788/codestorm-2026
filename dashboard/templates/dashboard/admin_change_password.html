{% extends 'base.html' %}
{% block title %}Change Admin Password | CampusConnect{% endblock %}
{% block content %}
<div class="row justify-content-center my-4">
    <div class="col-12 col-md-6 col-lg-5">
        <div class="card border-0 shadow-sm rounded-4 p-4">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h4 class="fw-bold mb-0"><i class="fa-solid fa-key text-warning me-2"></i>Change Password</h4>
                <a href="{% url 'admin_dashboard' %}" class="btn btn-sm btn-outline-secondary">Back</a>
            </div>
            <form method="post">
                {% csrf_token %}
                {% for field in form %}
                    <div class="mb-3">
                        <label class="form-label fw-semibold">{{ field.label }}</label>
                        {{ field }}
                        {% if field.errors %}<div class="text-danger small">{{ field.errors }}</div>{% endif %}
                    </div>
                {% endfor %}
                <button type="submit" class="btn btn-primary w-100 fw-semibold">Update Admin Password</button>
            </form>
        </div>
    </div>
</div>
<script>
document.querySelectorAll('input').forEach(el => el.classList.add('form-control'));
</script>
{% endblock %}
